[package]
name = "mayachok"
version = "0.1.1"
description = "Маячок — голосовой ввод для Windows"
authors = ["Mark Baranov"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "mayachok_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["local-whisper"]
# Локальное распознавание через whisper.cpp
local-whisper = ["dep:whisper-rs", "dep:whisper-rs-sys"]
# Ускорение на видеокарте (нужен соответствующий SDK при сборке)
cuda = ["local-whisper", "whisper-rs/cuda"]
vulkan = ["local-whisper", "whisper-rs/vulkan"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
hound = "3.5"
arboard = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "native-tls", "stream"] }
regex = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
whisper-rs = { version = "0.14", optional = true }
# Напрямую — чтобы спросить у ggml список видеокарт
whisper-rs-sys = { version = "0.13", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_Media_Audio",
  "Win32_Graphics_Gdi",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
